}

<body>

  </aside>
  <main class="content" id="main">
    <div class="topbar"><div class="top-meta"><button id="menuBtn" class="mobile-menu" aria-label="فتح القائمة" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span>مساحة العمل</span><span class="slash">/</span><strong id="crumbText">الطلاب</strong></div><div class="top-right"><span class="demo-chip" title="لا توجد صلة بقاعدة بيانات الموقع الحقيقي">نسخة تجريبية</span><div class="avatar-small" aria-label="حساب المدير التجريبي">م</div></div></div>

  </main>

<script>
(function(){
"use strict";
const KEY='edu-admin-prototype-v2';
const icons={
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>',
 users:'<path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 book:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 5V3h8v2M8 11h8M8 15h5"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 arrow:'<path d="m15 18-6-6 6-6"/>',
 dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 rotate:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
};
const ico=(name,size)=>'<svg class="ico" aria-hidden="true" viewBox="0 0 24 24" style="'+(size?'width:'+size+'px;height:'+size+'px':'')+'">'+(icons[name]||'')+'</svg>';
const seed=()=>({
 classes:[
 {id:'c1',name:'العربية للمبتدئين',level:'A1',gender:'m',teacher:'المعلم أحمد',created:'2026-09-12'},
 {id:'c2',name:'المحادثة والتواصل',level:'A2',gender:'f',teacher:'المعلمة سارة',created:'2026-10-01'},
 {id:'c3',name:'القراءة والاستماع',level:'B1',gender:'m',teacher:'المعلم أحمد',created:'2026-10-15'},
 {id:'c4',name:'القواعد التطبيقية',level:'B2',gender:'f',teacher:'المعلمة سارة',created:'2026-11-02'}
 ],
 students:[
 {id:'s1',name:'يوسف حسن',email:'yousef@example.com',classId:'c1',joined:'2026-09-16'},
 {id:'s2',name:'محمد إسلام',email:'m.islam@example.com',classId:'c1',joined:'2026-09-17'},
 {id:'s3',name:'عبد الله كريم',email:'',classId:'c1',joined:'2026-09-25'},
 {id:'s4',name:'مريم يوسف',email:'maryam@example.com',classId:'c2',joined:'2026-10-03'},
 {id:'s5',name:'نور فاطمة',email:'nour@example.com',classId:'c2',joined:'2026-10-07'},
 {id:'s6',name:'عائشة عمر',email:'aisha@example.com',classId:'c2',joined:'2026-10-07'},
 {id:'s7',name:'علي منصور',email:'ali@example.com',classId:'c3',joined:'2026-10-17'},
 {id:'s8',name:'إبراهيم محمود',email:'ibrahim@example.com',classId:'c3',joined:'2026-10-20'},
 {id:'s9',name:'عثمان علي',email:'',classId:'c3',joined:'2026-10-25'},
 {id:'s10',name:'زينب أحمد',email:'zainab@example.com',classId:'c4',joined:'2026-11-02'},
 {id:'s11',name:'هدى مصطفى',email:'huda@example.com',classId:'c4',joined:'2026-11-04'},
 {id:'s12',name:'صفية عمر',email:'safiya@example.com',classId:'c4',joined:'2026-11-06'}
 ]
});
function load(){try{const val=JSON.parse(localStorage.getItem(KEY));if(val&&Array.isArray(val.classes)&&Array.isArray(val.students))return val;}catch(e){}return seed()}
let data=load();let ui={view:'students',search:'',classFilter:'all',status:'all',sort:'newest',classSearch:'',classSort:'newest',drawer:null,bulk:false,bulkRows:2};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cls(id){return data.classes.find(x=>x.id===id)}
function stu(id){return data.students.find(x=>x.id===id)}
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('')}
function date(d){try{return new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'})}catch{return d}}
function studentCount(id){return data.students.filter(x=>x.classId===id).length}
function today(){return new Date().toISOString().slice(0,10)}
function id(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const node=document.createElement('div');node.className='toast';node.innerHTML=ico('check')+'<span></span>';node.querySelector('span').textContent=msg;document.querySelector('#toastMount').appendChild(node);setTimeout(()=>node.remove(),3200)}
function clsOptions(selected){return data.classes.map(c=>'<option value="'+e(c.id)+'" '+(selected===c.id?'selected':'')+'>'+e(c.name)+'</option>').join('')}
function stats(items){return '<div class="stats-line">'+items.map((s,i)=>'<div class="stat"><div class="stat-icon '+(i===1?'grn':i===2?'org':'')+'">'+ico(s.icon,19)+'</div><div><b>'+s.value+'</b><span>'+s.label+'</span></div></div>').join('')+'</div>'}
function pageHead(title,desc,tag,actions){return '<div class="page-title"><div><div class="eyebrow"><span class="pinline"></span>'+tag+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="page-actions">'+actions+'</div></div>'}
function studentRows(){let rows=data.students.filter(s=>{
 const term=ui.search.trim().toLocaleLowerCase('ar');const x=cls(s.classId);
 return (!term||[s.name,s.email,x?.name||''].some(v=>v.toLocaleLowerCase('ar').includes(term)))&&(ui.classFilter==='all'||s.classId===ui.classFilter)&&(ui.status==='all'||(ui.status==='active'?!!s.email:!s.email));
});
rows.sort((a,b)=>ui.sort==='name'?a.name.localeCompare(b.name,'ar'):ui.sort==='class'?(cls(a.classId)?.name||'').localeCompare(cls(b.classId)?.name||'','ar'):b.joined.localeCompare(a.joined));
return rows;
}
function getTable(){let rows=studentRows();return rows.length?'<div class="table-scroll"><table class="data-table"><thead><tr><th>اسم الطالب</th><th>الفصل</th><th>حساب الطالب</th><th>تاريخ الإضافة</th><th></th></tr></thead><tbody>'+rows.map((s,i)=>'<tr data-id="'+e(s.id)+'" tabindex="0" aria-label="عرض تفاصيل '+e(s.name)+'"><td><div class="person"><div class="person-avatar" style="--av-bg:'+(i%4===1?'#e7f6f0':i%4===2?'#fff0e9':i%4===3?'#ebf0fb':'#eeebff')+';--av-fg:'+(i%4===1?'#388a71':i%4===2?'#bf795a':i%4===3?'#4a75a6':'#6557cb')+'">'+e(initials(s.name))+'</div><div><b>'+e(s.name)+'</b><small dir="ltr">'+e(s.email||'بدون بريد إلكتروني')+'</small></div></div></td><td>'+e(cls(s.classId)?.name||'غير محدد')+'</td><td><span class="pill '+(s.email?'ok':'warn')+'">'+(s.email?'بريد مسجّل':'بيانات فقط')+'</span></td><td>'+e(date(s.joined))+'</td><td><button class="td-dots" type="button" data-detail="'+e(s.id)+'" aria-label="تفاصيل '+e(s.name)+'">'+ico('dots',16)+'</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><div class="empty-icon">'+ico('search',25)+'</div><strong>لا توجد نتائج مطابقة</strong><p>جرّب تعديل البحث أو إزالة أحد الفلاتر.</p><button class="btn secondary sm" data-clear-filters>مسح الفلاتر</button></div>';
}
function renderStudentPage(){
let c=data.students.filter(s=>!!s.email).length;
let options='<option value="all">جميع الفصول</option>'+clsOptions(ui.classFilter);
let actions='<button class="btn secondary" data-export>'+ico('download')+'تصدير CSV</button><button class="btn primary" data-add-student>'+ico('plus')+'إضافة طالب</button>';
let html=pageHead('الطلاب','بيانات طلابك، مرتبة وسهلة الوصول والتحديث.','إدارة الطلاب',actions)+stats([{value:data.students.length,label:'إجمالي الطلاب',icon:'users'},{value:c,label:'لديهم بريد مسجّل',icon:'check'},{value:data.students.length-c,label:'بيانات بدون بريد',icon:'clock'}]);
html+='<div class="board"><div class="panel"><div class="panel-head"><h2>قائمة الطلاب</h2><span class="hint" id="countLabel">'+studentRows().length+' من '+data.students.length+' طلاب</span></div><div class="toolbar"><label class="search">'+ico('search')+'<input type="search" id="studentSearch" placeholder="ابحث باسم الطالب أو البريد أو الفصل..." value="'+e(ui.search)+'" aria-label="البحث عن طالب"></label><select id="studentClass" class="select" aria-label="فلترة حسب الفصل">'+options+'</select><select id="studentStatus" class="select" aria-label="فلترة الحساب"><option value="all" '+(ui.status==='all'?'selected':'')+'>جميع الحالات</option><option value="active" '+(ui.status==='active'?'selected':'')+'>لديهم بريد</option><option value="pending" '+(ui.status==='pending'?'selected':'')+'>بدون بريد</option></select><select id="studentSort" class="select" aria-label="ترتيب الطلاب"><option value="newest" '+(ui.sort==='newest'?'selected':'')+'>الأحدث</option><option value="name" '+(ui.sort==='name'?'selected':'')+'>الاسم</option><option value="class" '+(ui.sort==='class'?'selected':'')+'>الفصل</option></select></div><div id="studentsTable">'+getTable()+'</div><div class="table-footer"><span>انقر على أي طالب لعرض ملفه وتعديل بياناته</span><span>نموذج تجريبي</span></div></div>';
html+='<aside class="panel side-panel"><h3>فصولك الحالية</h3><p>انتقل مباشرة للفصل أو اعرض طلابه.</p>'+data.classes.slice(0,6).map((cl,i)=>'<button class="mini-class" data-open-class="'+e(cl.id)+'"><span class="mini-icon">'+ico('book',17)+'</span><span><span class="mini-class-name">'+e(cl.name)+'</span><span class="mini-class-sub">المستوى '+e(cl.level||'—')+'</span></span><span class="mini-count">'+studentCount(cl.id)+'</span></button>').join('')+'<button class="mini-footer" data-nav="classes">عرض جميع الفصول '+ico('arrow',14)+'</button></aside></div>';
return html;
}
function getClasses(){let list=data.classes.filter(c=>!ui.classSearch||[c.name,c.level,c.teacher].some(v=>(v||'').toLocaleLowerCase('ar').includes(ui.classSearch.toLocaleLowerCase('ar'))));list.sort((a,b)=>ui.classSort==='name'?a.name.localeCompare(b.name,'ar'):b.created.localeCompare(a.created));return list;}
function renderClassPage(){let active=data.classes.length, actions='<button class="btn secondary" data-reset>'+ico('rotate')+'إعادة بيانات العرض</button><button class="btn primary" data-add-class>'+ico('plus')+'فصل جديد</button>';
let html=pageHead('الفصول','أنشئ الفصول، افتح تفاصيلها، وأضف الطلاب مباشرة.','إدارة الفصول',actions)+stats([{value:active,label:'الفصول الحالية',icon:'book'},{value:data.students.length,label:'الطلاب داخل الفصول',icon:'users'},{value:active?Math.round(data.students.length/active):0,label:'متوسط الطلاب للفصل',icon:'check'}]);
html+='<div class="classes-controls"><div class="class-headline">جميع الفصول <span style="font-size:11px;color:#99a1ad;font-weight:600">('+getClasses().length+')</span></div><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><label class="search" style="flex:none;width:min(220px,100%)">'+ico('search')+'<input id="classSearch" type="search" value="'+e(ui.classSearch)+'" placeholder="ابحث عن فصل..." aria-label="ابحث عن فصل"></label><select class="select" id="classSort"><option value="newest" '+(ui.classSort==='newest'?'selected':'')+'>الأحدث</option><option value="name" '+(ui.classSort==='name'?'selected':'')+'>الاسم</option></select></div></div><div id="classCards">'+getClassCards()+'</div>';
return html;}
function getClassCards(){let list=getClasses();return list.length?'<div class="classes-list">'+list.map((c,i)=>'<button type="button" class="class-card" data-open-class="'+e(c.id)+'"><div class="class-card-top"><span class="class-icon" style="--class-bg:'+(i%3===0?'#eeeaff':i%3===1?'#e5f5ee':'#fff1e8')+';--class-color:'+(i%3===0?'#6757cf':i%3===1?'#3c9477':'#b8835b')+'">'+ico('book',22)+'</span><span class="pill">'+(c.gender==='f'?'بنات':'بنين')+'</span></div><h3>'+e(c.name)+'</h3><div class="level">المستوى '+e(c.level||'—')+' · '+e(c.teacher||'—')+'</div><div class="class-foot"><span class="class-count"><b>'+studentCount(c.id)+'</b> طالب</span><span class="open">عرض التفاصيل ←</span></div></button>').join('')+'</div>':'<div class="empty"><div class="empty-icon">'+ico('search',25)+'</div><strong>لا توجد فصول مطابقة</strong><p>جرّب تغيير البحث أو أضف فصلًا جديدًا.</p></div>'}
function render(){document.querySelector('#crumbText').textContent=ui.view==='students'?'الطلاب':'الفصول';document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('selected',el.classList.contains('nav-item')&&el.dataset.nav===ui.view));document.querySelector('#page').innerHTML=ui.view==='students'?renderStudentPage():renderClassPage();}
function updateTable(){let holder=document.querySelector('#studentsTable');if(holder)holder.innerHTML=getTable();let label=document.querySelector('#countLabel');if(label)label.textContent=studentRows().length+' من '+data.students.length+' طلاب';}
function updateClasses(){let holder=document.querySelector('#classCards');if(holder)holder.innerHTML=getClassCards();let headline=document.querySelector('.class-headline span');if(headline)headline.textContent='('+getClasses().length+')';}
function switchView(view){ui.view=view;ui.search='';ui.classSearch='';document.querySelector('.app').classList.remove('nav-open');document.querySelector('#menuBtn').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'auto'});}
function drawer(title,sub,body,actions,label){closeDrawer();ui.drawer=label||title;const mount=document.querySelector('#drawerMount');mount.innerHTML='<div class="overlay" id="overlay"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-header"><div><div class="drawer-label">'+e(label||'إدارة البيانات')+'</div><h2 id="drawerTitle">'+e(title)+'</h2><p>'+e(sub||'')+'</p></div><button type="button" class="close" data-close-drawer aria-label="إغلاق النافذة">'+ico('close')+'</button></div><div class="drawer-body">'+body+'</div><div class="drawer-actions">'+(actions||'<button class="btn secondary" data-close-drawer>إغلاق</button>')+'</div></div>';document.body.style.overflow='hidden';let focus=mount.querySelector('input,select,button');if(focus)focus.focus();}
function closeDrawer(){document.querySelector('#drawerMount').innerHTML='';document.body.style.overflow='';ui.drawer=null;}
function showError(message){let node=document.querySelector('#formError');if(node){node.textContent=message;node.hidden=false;}else toast(message);}
function studentForm(opts={}){let editing=opts.studentId?stu(opts.studentId):null;let selected=editing?editing.classId:opts.classId||ui.classFilter!=='all'&&ui.classFilter||data.classes[0]?.id;
if(!data.classes.length){toast('أضف فصلًا أولًا.');return classForm();}
let body='<form id="studentForm" autocomplete="off"><div class="field"><label for="newStudentName">اسم الطالب <span style="color:var(--red)">*</span></label><input id="newStudentName" name="name" required maxlength="100" value="'+e(editing?.name||'')+'" placeholder="مثلًا: عمر محمد" autofocus></div><div class="field"><label for="newStudentEmail">البريد الإلكتروني <span style="color:#9aa3ae;font-weight:600">(اختياري)</span></label><input id="newStudentEmail" type="email" dir="ltr" name="email" maxlength="254" value="'+e(editing?.email||'')+'" placeholder="student@example.com"><small>وجود بريد هنا لا ينشئ حساب دخول حقيقيًا في هذه المعاينة.</small></div><div class="field"><label for="newStudentClass">الفصل <span style="color:var(--red)">*</span></label><select id="newStudentClass" name="classId" required>'+clsOptions(selected)+'</select></div><div class="form-note">بيانات العرض محفوظة محليًا في متصفحك فقط. لن يُنشأ حساب طالب أو تُرسل بيانات إلى قاعدة المنصة.</div><div id="formError" class="form-error" hidden></div></form>';
drawer(editing?'تعديل بيانات الطالب':'إضافة طالب',editing?'تحديث بيانات الطالب ضمن النسخة التجريبية':'ثلاث خطوات بسيطة، بدون نماذج طويلة.',body,'<button class="btn primary" data-save-student>'+(editing?'حفظ التعديلات':'إضافة الطالب')+'</button><button class="btn secondary" data-close-drawer>إلغاء</button>','الطلاب / بيانات الطالب');
window._editStudentId=editing?.id||null;
}
function bulkForm(classId){if(!data.classes.length)return classForm();ui.bulkRows=2;let body='<div class="field"><label for="bulkClass">إضافة إلى الفصل</label><select id="bulkClass">'+clsOptions(classId||data.classes[0].id)+'</select></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px"><b>بيانات الطلاب</b><small style="color:#9da6b2">حتى 8 طلاب</small></div><div class="bulk-rows" id="bulkRows"></div><button type="button" class="add-row" data-add-row>+ إضافة صف</button><div class="form-note">كل طالب له صف مستقل. البريد اختياري، ولن يُنشئ حسابًا فعليًا في النموذج.</div><div id="formError" class="form-error" hidden></div>';
drawer('إضافة مجموعة طلاب','أضف الأسماء والبريد في صفوف منفصلة.',body,'<button class="btn primary" data-save-bulk>إضافة المجموعة</button><button class="btn secondary" data-close-drawer>إلغاء</button>','الطلاب / إضافة مجموعة');addBulkRow();addBulkRow();}
function addBulkRow(){let rows=document.querySelector('#bulkRows');if(!rows||rows.children.length>=8)return;let row=document.createElement('div');row.className='bulk-row';row.innerHTML='<input type="text" class="bulk-name" placeholder="اسم الطالب" maxlength="100" aria-label="اسم الطالب"><input type="email" dir="ltr" class="bulk-email" placeholder="البريد (اختياري)" aria-label="البريد الإلكتروني"><button type="button" class="remove" data-remove-row title="حذف الصف">×</button>';rows.appendChild(row);}
function classForm(classId){let editing=classId?cls(classId):null;let body='<form id="classForm"><div class="field"><label for="className">اسم الفصل <span style="color:var(--red)">*</span></label><input id="className" required maxlength="100" value="'+e(editing?.name||'')+'" placeholder="مثلًا: العربية للمبتدئين"></div><div class="field-grid"><div class="field"><label for="classLevel">المستوى</label><select id="classLevel">'+['A1','A2','B1','B2','C1','C2'].map(l=>'<option '+((editing?.level||'A1')===l?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="field"><label for="classTeacher">المعلم المسؤول</label><input id="classTeacher" value="'+e(editing?.teacher||'المعلم أحمد')+'" maxlength="80" required></div></div><div class="field"><div class="label">الفصل مخصص لمن؟</div><div class="gender-choices"><label><input type="radio" name="classGender" value="m" '+((editing?.gender||'m')==='m'?'checked':'')+'> بنين</label><label><input type="radio" name="classGender" value="f" '+(editing?.gender==='f'?'checked':'')+'> بنات</label></div></div><div class="form-note">البيانات هنا للتجربة فقط، ولا يتم إنشاء فصل في الموقع الأصلي.</div><div id="formError" class="form-error" hidden></div></form>';
drawer(editing?'تعديل الفصل':'فصل جديد',editing?'حدّث التفاصيل الأساسية للفصل.':'بيانات بسيطة وواضحة، ويمكن إضافة الطلاب بعد الإنشاء.',body,'<button class="btn primary" data-save-class>'+(editing?'حفظ التعديلات':'إنشاء الفصل')+'</button><button class="btn secondary" data-close-drawer>إلغاء</button>','الفصول / بيانات الفصل');window._editClassId=classId||null;}
function showStudent(id){let s=stu(id),c=s&&cls(s.classId);if(!s)return;let body='<div class="detail-top"><div class="big-avatar">'+e(initials(s.name))+'</div><div><b>'+e(s.name)+'</b><small>'+(s.email?'بريد مسجّل':'بيانات فقط — بلا بريد')+'</small></div></div><div class="detail-block"><h4>بيانات الطالب</h4><div class="detail-row"><span>الاسم الكامل</span><b>'+e(s.name)+'</b></div><div class="detail-row"><span>الفصل</span><b>'+e(c?.name||'غير محدد')+'</b></div><div class="detail-row"><span>البريد</span><b dir="ltr">'+e(s.email||'—')+'</b></div><div class="detail-row"><span>تاريخ الإضافة</span><b>'+e(date(s.joined))+'</b></div></div><div class="detail-block"><h4>الحالة</h4><div class="form-note">'+(s.email?'هذا الطالب لديه بريد مسجّل في النموذج. لم ننشئ حسابًا فعليًا أو نتحقق من دخوله.':'أُضيف الطالب دون بريد. لا يمكنه تسجيل الدخول إلى المنصة الحقيقية من هذا النموذج.')+'</div></div>';
drawer('ملف الطالب','تفاصيل الطالب في مكان واحد.',body,'<button class="btn primary" data-edit-student="'+e(s.id)+'">تعديل البيانات</button><button class="btn secondary" data-student-class="'+e(s.classId)+'">فتح الفصل</button>','الطلاب / التفاصيل');}
function showClass(id){let c=cls(id);if(!c)return;let kids=data.students.filter(s=>s.classId===id);let body='<div class="detail-top"><div class="big-avatar">'+ico('book',28)+'</div><div><b>'+e(c.name)+'</b><small>المستوى '+e(c.level)+' · '+(c.gender==='f'?'بنات':'بنين')+'</small></div></div><div class="detail-block"><h4>بيانات الفصل</h4><div class="detail-row"><span>المعلم المسؤول</span><b>'+e(c.teacher||'—')+'</b></div><div class="detail-row"><span>عدد الطلاب</span><b>'+kids.length+' طالب</b></div><div class="detail-row"><span>تاريخ الإنشاء</span><b>'+e(date(c.created))+'</b></div></div><div class="detail-block"><h4>طلاب الفصل</h4><div class="detail-list">'+(kids.length?kids.map(k=>'<button type="button" class="detail-student" data-detail="'+e(k.id)+'"><span class="person-avatar">'+e(initials(k.name))+'</span><span>'+e(k.name)+'</span><small>عرض ←</small></button>').join(''):'<p style="color:#96a1ac;font-size:11px">لم تتم إضافة طلاب لهذا الفصل بعد.</p>')+'</div></div>';
drawer('تفاصيل الفصل','إدارة الفصل وطلابه.',body,'<button class="btn primary" data-student-to-class="'+e(c.id)+'">'+ico('plus')+'إضافة طالب</button><button class="btn secondary" data-edit-class="'+e(c.id)+'">تعديل الفصل</button>','الفصول / التفاصيل');}
function saveStudent(){let form=document.querySelector('#studentForm');if(!form)return;let name=form.querySelector('[name="name"]').value.trim().replace(/\s+/g,' ');let email=form.querySelector('[name="email"]').value.trim().toLowerCase();let classId=form.querySelector('[name="classId"]').value;if(name.length<2)return showError('اكتب اسم الطالب بشكل صحيح.');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showError('أدخل بريدًا إلكترونيًا صحيحًا أو اتركه فارغًا.');if(!cls(classId))return showError('اختر فصلًا صحيحًا.');let duplicate=data.students.find(s=>s.email&&s.email.toLowerCase()===email&&s.id!==window._editStudentId);if(email&&duplicate)return showError('البريد مستخدم لطالب آخر في هذا النموذج.');if(window._editStudentId){let s=stu(window._editStudentId);if(!s)return;Object.assign(s,{name,email,classId});toast('تم تحديث بيانات الطالب.');}else{data.students.unshift({id:id(),name,email,classId,joined:today()});toast('تمت إضافة الطالب إلى النموذج.');}save();closeDrawer();render();}
function saveBulk(){let rows=Array.from(document.querySelectorAll('.bulk-row'));let classId=document.querySelector('#bulkClass')?.value;if(!cls(classId))return showError('اختر فصلًا صحيحًا.');let newStudents=[];for(const row of rows){let name=row.querySelector('.bulk-name').value.trim().replace(/\s+/g,' ');let email=row.querySelector('.bulk-email').value.trim().toLowerCase();if(!name&&!email)continue;if(name.length<2)return showError('اكتب اسمًا صحيحًا لكل طالب.');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showError('أحد عناوين البريد الإلكتروني غير صحيح.');if(email&&(data.students.some(s=>s.email.toLowerCase()===email)||newStudents.some(s=>s.email===email)))return showError('هناك بريد مكرر.');newStudents.push({id:id(),name,email,classId,joined:today()});}if(!newStudents.length)return showError('اكتب بيانات طالب واحد على الأقل.');data.students.unshift(...newStudents);save();closeDrawer();render();toast('تمت إضافة '+newStudents.length+' من الطلاب إلى النموذج.');}
function saveClass(){const form=document.querySelector('#classForm');if(!form)return;const name=document.querySelector('#className').value.trim().replace(/\s+/g,' ');const level=document.querySelector('#classLevel').value;const teacher=document.querySelector('#classTeacher').value.trim();const gender=document.querySelector('input[name="classGender"]:checked')?.value||'m';if(name.length<2)return showError('اكتب اسم الفصل.');if(!teacher)return showError('اكتب اسم المعلم المسؤول.');if(data.classes.some(c=>c.name.trim()===name&&c.id!==window._editClassId))return showError('هذا الاسم مستخدم لفصل آخر.');if(window._editClassId){Object.assign(cls(window._editClassId),{name,level,teacher,gender});toast('تم تحديث بيانات الفصل.');}else{data.classes.unshift({id:id(),name,level,teacher,gender,created:today()});toast('تم إنشاء الفصل في النموذج.');}save();closeDrawer();render();}
function downloadCSV(){let rows=studentRows();let csv='\uFEFF'+[['الاسم','البريد','الفصل','تاريخ الإضافة'],...rows.map(s=>[s.name,s.email,cls(s.classId)?.name||'',s.joined])].map(cols=>cols.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='students-preview.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('تم تصدير قائمة الطلاب التجريبية.');}
function reset(){if(!confirm('هل تريد إعادة بيانات العرض التجريبية؟ سيتم إلغاء أي تعديلات محلية على هذا النموذج فقط.'))return;data=seed();save();ui.search='';ui.status='all';ui.classFilter='all';ui.classSearch='';closeDrawer();render();toast('تمت إعادة بيانات النموذج.');}
document.addEventListener('click',function(ev){let t=ev.target.closest('button, tr[data-id]');if(!t)return;if(t.hasAttribute('data-nav'))return switchView(t.dataset.nav);if(t.id==='menuBtn'){let open=document.querySelector('.app').classList.toggle('nav-open');t.setAttribute('aria-expanded',String(open));return;}if(t.dataset.addStudent!==undefined)return studentForm();if(t.dataset.addClass!==undefined)return classForm();if(t.dataset.export!==undefined)return downloadCSV();if(t.dataset.reset!==undefined)return reset();if(t.dataset.detail)return showStudent(t.dataset.detail);if(t.matches('tr[data-id]'))return showStudent(t.dataset.id);if(t.dataset.openClass)return showClass(t.dataset.openClass);if(t.dataset.clearFilters!==undefined){ui.search='';ui.classFilter='all';ui.status='all';render();return;}if(t.dataset.closeDrawer!==undefined)return closeDrawer();if(t.dataset.saveStudent!==undefined)return saveStudent();if(t.dataset.saveBulk!==undefined)return saveBulk();if(t.dataset.saveClass!==undefined)return saveClass();if(t.dataset.editStudent)return studentForm({studentId:t.dataset.editStudent});if(t.dataset.editClass)return classForm(t.dataset.editClass);if(t.dataset.studentClass){let v=t.dataset.studentClass;closeDrawer();switchView('classes');showClass(v);return;}if(t.dataset.studentToClass)return studentForm({classId:t.dataset.studentToClass});if(t.dataset.addRow!==undefined)return addBulkRow();if(t.dataset.removeRow!==undefined){let rows=document.querySelector('#bulkRows');if(rows&&rows.children.length>1)t.closest('.bulk-row').remove();return;} });
document.querySelector('#screenShade').addEventListener('click',()=>{document.querySelector('.app').classList.remove('nav-open');document.querySelector('#menuBtn').setAttribute('aria-expanded','false')});
document.querySelector('#drawerMount').addEventListener('click',ev=>{if(ev.target.id==='overlay')closeDrawer()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(document.querySelector('.drawer'))closeDrawer();else document.querySelector('.app').classList.remove('nav-open');}if(ev.key==='Enter'&&ev.target.matches('tr[data-id]')){ev.preventDefault();showStudent(ev.target.dataset.id);}});
document.addEventListener('input',ev=>{if(ev.target.id==='studentSearch'){ui.search=ev.target.value;updateTable();}if(ev.target.id==='classSearch'){ui.classSearch=ev.target.value;updateClasses();}});
document.addEventListener('change',ev=>{if(ev.target.id==='studentClass'){ui.classFilter=ev.target.value;updateTable();}if(ev.target.id==='studentStatus'){ui.status=ev.target.value;updateTable();}if(ev.target.id==='studentSort'){ui.sort=ev.target.value;updateTable();}if(ev.target.id==='classSort'){ui.classSort=ev.target.value;updateClasses();}});
// Offer bulk entry from the add-student drawer; no textarea import.
let bulkLinkHook=new MutationObserver(()=>{let form=document.querySelector('#studentForm');if(form&&!form.dataset.bulkLink){form.dataset.bulkLink='1';let note=form.querySelector('.form-note');if(note){let button=document.createElement('button');button.type='button';button.className='btn quiet';button.style.cssText='width:100%;margin-top:11px;justify-content:flex-start;padding:8px 0;color:var(--indigo)';button.innerHTML=ico('plus')+' إضافة مجموعة طلاب بدلًا من طالب واحد';button.addEventListener('click',()=>bulkForm(form.querySelector('[name="classId"]').value));note.after(button);}}});bulkLinkHook.observe(document.querySelector('#drawerMount'),{childList:true,subtree:true});
render();
})();
</script>
</body>
</html>
